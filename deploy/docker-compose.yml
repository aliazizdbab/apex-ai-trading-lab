services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-apex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apex_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-apex_trading}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - apex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apex} -d ${POSTGRES_DB:-apex_trading}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - apex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD:-apex_change_me}@postgres:5432/${POSTGRES_DB:-apex_trading}
      REDIS_URL: redis://redis:6379/0
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.workers.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-apex}:${POSTGRES_PASSWORD:-apex_change_me}@postgres:5432/${POSTGRES_DB:-apex_trading}
      REDIS_URL: redis://redis:6379/0
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-}

volumes:
  apex_pg_data:
  apex_redis_data:
